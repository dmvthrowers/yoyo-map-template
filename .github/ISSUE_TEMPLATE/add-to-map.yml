name: Add me to the map
description: Ask to be listed as a person, group, or place.
title: "Add to map: "
labels: ["add-to-map"]
body:
  - type: markdown
    attributes:
      value: |
        This form is **public**. Everything you type here can be seen by anyone.
        Don't include an email, phone number, or street address.
        People are shown at city level only.
  - type: input
    id: name
    attributes:
      label: Display name
      description: First name, nickname, or handle. For a group or place, its public name.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: I'm adding
      description: The map owner files you under the matching category on their map.
      options: [Myself (a person), A group or club, A shop, venue, or public place]
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: City and state or country
      placeholder: Springfield, IL
    validations:
      required: true
  - type: input
    id: toys
    attributes:
      label: What are you into?
      placeholder: yo-yo, kendama
  - type: input
    id: link
    attributes:
      label: Link (optional)
      description: An https:// website, Instagram, or YouTube link.
  - type: input
    id: note
    attributes:
      label: One short line (optional)
      placeholder: Meets 3rd Sundays at the library
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I'm 13 or older, or a parent or guardian is submitting this for me.
          required: true
        - label: I understand this listing is public and I can ask to be removed at any time.
          required: true
